# golangci-lint v2 configuration. Conservative set: the default linters plus a
# few high-signal additions. Formatters (gofmt, goimports) are separate in v2.
version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      # The demo seed (#420) names things in Italian too; misspell reads
      # those as English typos. Only these words, so real typos still show.
      - linters:
          - misspell
        text: "`(Contanti|Distributore)` is a misspelling"

formatters:
  enable:
    - gofmt
    - goimports
