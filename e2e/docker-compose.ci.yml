# CI-only compose: builds the image from the repo and runs it for the
# Playwright e2e job. Not for production use (see ../docker-compose.yml).
services:
  cloudbank:
    # The image is built (with a shared layer cache) by the CI e2e job before
    # `compose up`; see .github/workflows/ci.yml. Build locally with:
    #   docker build -t cloudbank:e2e --build-arg VERSION=e2e ..
    image: cloudbank:e2e
    ports:
      - "8080:8080"
    environment:
      CB_SECURE_COOKIES: "false"
      CB_LOG_LEVEL: "info"
    volumes:
      - cb-e2e-data:/data

  # The SSO-only server (#620) and the pretend provider it signs in through,
  # for `npm run test:sso`. Both sit on the host network so the browser and
  # CloudBank reach the provider at the same address, which the ID token's
  # issuer has to match.
  fake-idp:
    image: node:26-alpine
    network_mode: host
    command: ["node", "/sso/fake-idp.mjs"]
    environment:
      FAKE_IDP_PORT: "9000"
    volumes:
      - ./sso:/sso:ro
  cloudbank-sso:
    image: cloudbank:e2e
    network_mode: host
    depends_on:
      - fake-idp
    environment:
      CB_ADDR: ":8081"
      CB_SECURE_COOKIES: "false"
      CB_LOG_LEVEL: "info"
      CB_PASSWORD_LOGIN: "false"
      CB_OIDC_ISSUER: "http://localhost:9000"
      CB_OIDC_CLIENT_ID: "cloudbank"
      # The pretend provider accepts any secret; this one guards nothing.
      CB_OIDC_CLIENT_SECRET: "e2e-only"
      CB_OIDC_REDIRECT_URL: "http://localhost:8081/api/v1/auth/oidc/callback"
      CB_OIDC_NAME: "Fake IdP"
      CB_OIDC_ADMIN_EMAIL: "admin@example.com"
    volumes:
      - cb-sso-data:/data

  # Bank mails end to end (#657, #658, #659) and the notification channels
  # (#686), for `npm run test:mail`: a
  # CloudBank that signs in to a pretend Microsoft and reads its IMAP server,
  # logs in with an app password to a pretend provider's, and has the mails no
  # pattern reads read by a pretend AI, all on this machine
  # (CloudBank allows plain http and IMAP only there, and only when told). The image is
  # built by the CI e2e job; locally:
  #   docker build -f e2e/mail/Dockerfile -t cloudbank-e2e-mail ..
  e2e-mail:
    image: cloudbank-e2e-mail
    network_mode: host
    environment:
      E2E_MAIL_HTTP: "127.0.0.1:9100"
      E2E_MAIL_IMAP: "127.0.0.1:1143"
      E2E_MAIL_PASSWORD_IMAP: "127.0.0.1:1144"
      E2E_MAIL_SMTP: "127.0.0.1:1025"
  cloudbank-mail:
    image: cloudbank:e2e
    network_mode: host
    depends_on:
      - e2e-mail
    environment:
      CB_ADDR: "127.0.0.1:8082"
      CB_SECURE_COOKIES: "false"
      CB_LOG_LEVEL: "info"
      CB_UPDATE_CHECK: "false"
      # Mailbox credentials are stored only encrypted; this key guards
      # nothing but the pretend mailbox's tokens.
      CB_SECRET_KEY: "e2e-only-not-a-secret"
      CB_MS_CLIENT_ID: "e2e"
      CB_MS_AUTHORITY: "http://127.0.0.1:9100"
      CB_MS_IMAP: "127.0.0.1:1143"
      CB_MAIL_LOCAL_IMAP: "127.0.0.1:1144"
      # Notifications by email (#686) go to the pretend server's SMTP, which
      # takes plain text on this machine only.
      CB_SMTP_HOST: "127.0.0.1"
      CB_SMTP_PORT: "1025"
      CB_SMTP_TLS: "none"
      CB_SMTP_FROM: "cloudbank@example.com"
      # The shared Matrix bot (#687) lives on the pretend homeserver; its token
      # is a test value of that server.
      CB_MATRIX_HOMESERVER: "http://127.0.0.1:9100"
      CB_MATRIX_TOKEN: "e2e-matrix-bot"
    volumes:
      - cb-mail-data:/data

volumes:
  cb-e2e-data:
  cb-sso-data:
  cb-mail-data:
