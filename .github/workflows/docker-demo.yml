name: Docker demo

# Publishes the public demo image, ghcr.io/easly1989/cloudbank:demo (#420). By
# hand only: a host that redeploys on a new :demo (Northflank does) resets every
# demo account when it does, so a push here is a reset for whoever is using the
# demo at that moment. The demo says so on its front door, in its notice and in
# the band on every page.
#
# The image is the demo build (DEMO=1): throwaway accounts, no setup or login,
# no admin, restore, attachments, AI, push, API tokens, two-factor or OIDC, and
# a pretend bank in place of the real ones. It never reaches :latest or :main.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build the demo from
        required: false
        default: main

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-demo
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/easly1989/cloudbank

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # amd64 only: the demo runs on one hosted instance, not on anyone's Pi.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=demo-${{ steps.vars.outputs.sha }}
            DEMO=1
          tags: |
            ${{ env.IMAGE }}:demo
            ${{ env.IMAGE }}:demo-${{ steps.vars.outputs.sha }}
          cache-from: type=gha,scope=demo
          cache-to: type=gha,mode=max,scope=demo
