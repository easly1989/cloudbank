name: Languages

# The language check (#614): every page, in every language, at the widths where
# a longer word breaks a layout, against the demo build. It runs only when what
# a page shows can change: a translation, a component, a stylesheet. A change
# to the server alone does not start it. Run by hand, it also makes a sheet per
# language, every page side by side, for a translation's reviewer.

on:
  pull_request:
    paths:
      - "web/src/i18n/locales/**"
      - "web/src/**/*.tsx"
      - "web/src/**/*.css"
      - "web/src/theme.ts"
      - "e2e/i18n/**"
      - "e2e/pages.ts"
      - "e2e/playwright.i18n.config.ts"
      - ".github/workflows/i18n.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  languages:
    name: Every page in every language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: docker/setup-buildx-action@v4
      - name: Build the demo image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: cloudbank:demo-i18n
          build-args: |
            VERSION=demo-i18n
            DEMO=1
          # The same layers as the demo e2e job in ci.yml.
          cache-from: type=gha,scope=demo
          cache-to: type=gha,mode=max,scope=demo
      - name: Start the demo
        run: |
          docker run -d --name cb-demo -p 8080:8080 -e CB_SECURE_COOKIES=false -e CB_DEMO_SESSIONS_PER_HOUR=100 cloudbank:demo-i18n
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz; then ok=1; break; fi
            sleep 2
          done
          test -n "$ok"
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install Playwright browser
        working-directory: e2e
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Run the language check
        working-directory: e2e
        run: npm run test:i18n
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Make a sheet per language
        if: github.event_name == 'workflow_dispatch'
        working-directory: e2e
        run: node i18n/sheet.mjs
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Upload the sheets
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: language-sheets
          path: e2e/test-results/i18n-sheets/
          retention-days: 14
      - name: Container logs on failure
        if: failure()
        run: docker logs cb-demo
      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-i18n-artifacts
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
